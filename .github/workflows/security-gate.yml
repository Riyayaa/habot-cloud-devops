name: Fail-Closed Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-gate:
    name: Lint, Validate and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive task-1-terraform

      - name: Validate Terraform
        working-directory: task-1-terraform
        run: terraform init -backend=false && terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linters
        run: pip install black flake8

      - name: Check Python formatting
        run: black --check task-3-django --exclude '(^|/)(.venv|migrations)(/|$)'

      - name: Run Python lint
        run: flake8 task-3-django

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quarantine-on-failure:
    name: Quarantine Failed Build
    if: ${{ failure() }}
    needs: security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Create quarantine record
        run: |
          mkdir -p quarantine
          cat > quarantine/SECURITY_GATE_FAILED.txt <<'EOF'
          SECURITY GATE FAILED

          The CI security gate detected a failed validation, lint,
          formatting, or secret-scanning check.

          Build status: QUARANTINED
          Further review is required before this change can be accepted.
          EOF

      - name: Upload quarantine artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-build
          path: quarantine/SECURITY_GATE_FAILED.txt